name: CI & Content Audit

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Run tests
        run: npm test -- --run

      # DDDnD Pack Studio: a separate app sharing the domain code (ADR 0005)
      - name: Build the Studio
        run: npx vite build --config studio/vite.config.ts

      # 50 runs leaves a +/-14 point margin on a win rate, which is wider than
      # the bands being checked. 400 costs about ten seconds and makes the
      # scenario_difficulty findings mean something.
      - name: Content audit gate
        run: npm run audit:gate -- --runs 400

      # The docs site deploys only from main (pages.yml), so a change that breaks
      # it passed every PR: M3 slice 6 removed a table the catalog script read,
      # and the docs deploy failed from then on. Building it here catches that.
      - name: Docs site still builds
        env:
          AUDIT_RUNS: '50'
        run: npm run docs:generate-data && npm run docs:build

  external-content-pack-validation:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci

      - name: Validate content pack structure
        run: npm run content:validate

      # Published packs depend on what base 1.x has shipped (CONTENT_VERSIONING.md,
      # "The Base Pack's Promise"). Also covered by the test suite; named here so
      # a failure says what it is.
      - name: Base content keeps its promise to published packs
        run: npm run content:lock:check

      - name: Validate content pack audit criticals
        run: npm run content:validate:audit
