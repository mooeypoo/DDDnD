# DDDnD Pack Studio ("The Forge"): its own Netlify site (ADR 0005).
#
# In Netlify, set Base directory = studio. Netlify then reads this file (not
# the game's netlify.toml) and runs commands from studio/. The Studio shares
# the game's domain code, so the build installs and builds from the
# repository root (cd ..). Paths below are relative to studio/.
# Steps: docs/PACK_STUDIO.md section 12.

[build]
  command = "cd .. && npm ci && npm run studio:build"
  publish = "dist"
  # Skip a deploy when nothing the Studio is built from has changed.
  # (git diff exits 0 when there's no difference, which tells Netlify to skip.)
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- . ../src/domains ../package.json ../package-lock.json"

[build.environment]
  NODE_VERSION = "24"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# The Studio fetches nothing from other sites (examples will come later and
# widen connect-src then, deliberately). Same strict script policy as the game.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Robots-Tag = "noindex"
